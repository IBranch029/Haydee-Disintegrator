[package]
name = "disintegrator"
version = "1.0.3"
edition = "2021"
rust-version = "1.82"
authors = ["IBranch029 <dev@ibranch029.dev>"]
description = "DISINTEGRATOR - premium ultra-deep uninstaller for Windows 11"
license = "Apache-2.0"
repository = "https://github.com/IBranch029/Haydee-Disintegrator"
readme = "../README.md"
keywords = ["uninstaller", "windows", "tauri", "registry", "purge"]
categories = ["system::utilities"]
default-run = "disintegrator"

[lib]
name = "disintegrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
log = "=0.4.35"
env_logger = "=0.11.11"
thiserror = "=2.0.21"
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Restore",
  "Win32_System_Console",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "=3.27.0"
winreg = "=0.56.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
